<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grid.css vs atomic grid</title>
  <link rel="stylesheet" href="/dist/a11y-atomic.css">
</head>
<body>
  <main>
    <div id="classic">
      <section class="ax-grid-section" style="--ax-grid-background: #eef">
        <h2 class="ax-grid-title">Title</h2>
        <div class="ax-grid-wrapper" style="--ax-grid-column-table: repeat(2, 1fr); --ax-grid-column-laptop: repeat(3, 1fr); --ax-grid-column-desktop: repeat(4, 1fr); --ax-grid-gap: 1.5rem">
          <div class="ax-grid-row">Row</div>
          <div class="ax-grid-column">One</div>
          <div class="ax-grid-column" style="--ax-grid-flow: row; --ax-grid-align-items: center">Two</div>
          <div class="ax-grid-column">Three</div>
          <div class="ax-grid-column">Four</div>
        </div>
        <div class="ax-grid-wrapper" style="--ax-grid-column-count: repeat(3, 1fr)">
          <div class="ax-grid-column">A</div>
          <div class="ax-grid-column">B</div>
        </div>
      </section>
    </div>
    <div id="atomic"></div>
  </main>
  <script type="module">
    import {grid} from '/src/grid.styles.js';
    import {classes} from '/src/atomic.js';
    const map = {'ax-grid-section': grid.section, 'ax-grid-title': grid.title, 'ax-grid-wrapper': grid.wrapper, 'ax-grid-row': grid.row, 'ax-grid-column': grid.column};
    const copy = document.getElementById('classic').cloneNode(true);
    for (const el of copy.querySelectorAll('[class]')) el.className = classes(map[el.className]);
    // grid.css's ".ax-grid-wrapper + .ax-grid-wrapper" sibling rule → wrapperNext
    const second = copy.querySelectorAll('section > div')[1];
    second.className = classes(grid.wrapper, grid.wrapperNext);
    document.getElementById('atomic').append(...copy.children);
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
